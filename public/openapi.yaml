        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: better-auth.session_token
      description: Set by signing in through the Authentication endpoints.
  parameters:
    workspace:
      name: workspace
      in: path
      required: true
      schema:
        type: string
      description: The workspace id. Always "default" for now.
    table:
      name: table
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    column:
      name: column
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    record:
      name: record
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    view:
      name: view
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    form:
      name: form
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    role:
      name: role
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    entry:
      name: entry
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
      description: A record trash entry id.
    file:
      name: file
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    BadRequest:
      description: The request is invalid. Schema failures return a ValidationError; other problems return
        an Error.
      content:
        application/json:
          schema:
            oneOf:
            - $ref: '#/components/schemas/ValidationError'
            - $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Not signed in. The framework answers with a plain text message.
      content:
        text/plain:
          schema:
            type: string
    Forbidden:
      description: You don't have permission to do this.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: The table, record or other item doesn't exist, or you can't see it.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: The change conflicts with existing data, for example a name that is already taken.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    PayloadTooLarge:
      description: The file is too large.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnsupportedMediaType:
      description: The file type isn't allowed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      properties:
        message:
          type: string
        field:
          type: string
      required:
      - message
      description: Returned for every error except schema validation failures. field is set when the error
        is about one field.
    ValidationError:
      type: object
      properties:
        error:
          const: Validation failed
        issues:
          type: array
          items:
            type: object
            properties:
              slot:
                enum:
                - params
                - query
                - body
              issues:
                type: array
                items:
                  type: object
                  properties:
                    message:
                      type: string
                    path:
                      type: array
                      items:
                        type:
                        - string
                        - integer
                  required:
                  - message
            required:
            - slot
            - issues
      required:
      - error
      - issues
    Ok:
      type: object
      properties:
        ok:
          const: true
      required:
      - ok
    Created:
      type: object
      properties:
        id:
          type: integer
      required:
      - id
    Trashed:
      type: object
      properties:
        trash:
          type: array
          items:
            type: integer
          description: Trash entry ids. Pass one to restore the record.
      required:
      - trash
    UserRef:
      type: object
      properties:
        id:
          type: string
        label:
          type: string
      required:
      - id
      - label
    RecordRef:
      type: object
      properties:
        id:
          type: integer
        label:
          type: string
      required:
      - id
      - label
      description: 'A linked record: its id and the value of its title column.'
    RecordRow:
      type: object
      properties:
        id:
          type: integer
        created_at:
          type: integer
          description: Unix time in milliseconds.
        updated_at:
          type: integer
          description: Unix time in milliseconds.
        created_by:
          anyOf:
          - $ref: '#/components/schemas/UserRef'
          - type: 'null'
        updated_by:
          anyOf:
          - $ref: '#/components/schemas/UserRef'
          - type: 'null'
      required:
      - id
      additionalProperties: true
      description: A record. Besides the system fields, every column is a key named after its columnName.
        Relation columns hold a RecordRef, user columns a UserRef, other columns their plain value.
    RecordsPage:
      type: object
      properties:
        rows:
          type: array
          items:
            $ref: '#/components/schemas/RecordRow'
        nextCursor:
          anyOf:
          - type: string
          - type: 'null'
        prevCursor:
          anyOf:
          - type: string
          - type: 'null'
        startCursor:
          anyOf:
          - type: string
          - type: 'null'
      required:
      - rows
      - nextCursor
      - prevCursor
      - startCursor
    RecordsExport:
      type: object
      properties:
        rows:
          type: array
          items:
            $ref: '#/components/schemas/RecordRow'
        truncated:
          type: boolean
          description: True when there were more records than the export limit.
      required:
      - rows
      - truncated
    ImportResult:
      type: object
      properties:
        created:
          type: integer
        failed:
          type: integer
        errors:
          type: array
          items:
            type: object
            properties:
              row:
                type: integer
              message:
                type: string
            required:
            - row
            - message
      required:
      - created
      - failed
      - errors
    Column:
      type: object
      properties:
        id:
          type: integer
        tableId:
          type: integer
        columnName:
          type: string
          description: Physical column name used as the key in record objects.
        name:
          type: string
        icon:
          anyOf:
          - type: string
          - type: 'null'
        type:
          type: string
        format:
          type: string
          description: The column format, such as text, integer, relation or single_select.
        isRequired:
          type: boolean
        isFilterable:
          type: boolean
        isSortable:
          type: boolean
        isSearchable:
          type: boolean
        isUnique:
          type: boolean
        isHidden:
          type: boolean
        checkExpression:
          anyOf:
          - type: string
          - type: 'null'
        generatedExpression:
          anyOf:
          - type: string
          - type: 'null'
        defaultValue:
          anyOf:
          - type: string
          - type: 'null'
        position:
          type: integer
        description:
          anyOf:
          - type: string
          - type: 'null'
        options:
          type: object
          additionalProperties: true
        metadata:
          type: object
          additionalProperties: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        deletedAt:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
        deletedBy:
          anyOf:
          - type: string
          - type: 'null'
      required:
      - id
      - tableId
      - columnName
      - name
      - format
    Table:
      type: object
      properties:
        id:
          type: integer
        tableName:
          type: string
        name:
          type: string
        description:
          anyOf:
          - type: string
          - type: 'null'
        icon:
          anyOf:
          - type: string
          - type: 'null'
        groupName:
          anyOf:
          - type: string
          - type: 'null'
        titleColumnId:
          anyOf:
          - type: integer
          - type: 'null'
        position:
          type: integer
        metadata:
          type: object
          additionalProperties: true
        createdBy:
          anyOf:
          - type: string
          - type: 'null'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        deletedAt:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
        deletedBy:
          anyOf:
          - type: string
          - type: 'null'
      required:
      - id
      - name
    TableSummary:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        icon:
          anyOf:
          - type: string
          - type: 'null'
        groupName:
          anyOf:
          - type: string
          - type: 'null'
        description:
          anyOf:
          - type: string
          - type: 'null'
        titleColumnId:
          anyOf:
          - type: integer
          - type: 'null'
        columnCount:
          type: integer
        updatedAt:
          type: string
          format: date-time
      required:
      - id
      - name
    TableDetail:
      allOf:
      - $ref: '#/components/schemas/Table'
      - type: object
        properties:
          columns:
            type: array
            items:
              $ref: '#/components/schemas/Column'
        required:
        - columns
    View:
      type: object
      properties:
        id:
          type: integer
        tableId:
          type: integer
        viewName:
          type: string
        name:
          type: string
        description:
          anyOf:
          - type: string
          - type: 'null'
        icon:
          anyOf:
          - type: string
          - type: 'null'
        type:
          type: string
        position:
          type: integer
        selectColumns:
          type: array
          items:
            type: string
        whereExpression:
          anyOf:
          - type: string
          - type: 'null'
        metadata:
          type: object
          additionalProperties: true
        createdBy:
          anyOf:
          - type: string
          - type: 'null'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        deletedAt:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
        deletedBy:
          anyOf:
          - type: string
          - type: 'null'
      required:
      - id
      - tableId
      - name
      - selectColumns
    ViewSummary:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          anyOf:
          - type: string
          - type: 'null'
        icon:
          anyOf:
          - type: string
          - type: 'null'
        columnCount:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
