# Nocosheet API, OpenAPI 3.1. Edit this file when a route in routes/api changes.
openapi: 3.1.0
info:
  title: Nocosheet API
  version: 1.0.0
  summary: The API the Nocosheet app uses.
  description: 'Everything the Nocosheet app does goes through this API.


    Requests are authenticated with the Better Auth session cookie. Sign-in, sessions, passkeys and member
    administration are documented in the Authentication reference, which administrators can open from
    the same page.


    What a member may do with records depends on their role. A permission on a view or a form is checked
    first, then the table, then the workspace-wide setting.'
servers:
- url: /api
  description: This server
security:
- sessionCookie: []
tags:
- name: App
  description: Setup, health and avatars.
- name: Access
  description: What the signed-in member may do.
- name: Tables
  description: Tables and their sidebar entries.
- name: Columns
  description: The fields of a table.
- name: Records
  description: Rows of a table.
- name: Views
  description: Saved column and filter selections of a table.
- name: Forms
  description: Forms that create records.
- name: Files
  description: Uploads for file and image columns.
- name: Roles
  description: Roles, assignments and permissions.
- name: Trash
  description: Deleted records, columns, tables, views and forms.
paths:
  /hello:
    get:
      tags:
      - App
      summary: Example route
      description: No sign-in needed.
      operationId: getHello
      security: []
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  framework:
                    type: string
                  database:
                    type: string
  /setup:
    get:
      tags:
      - App
      summary: Check whether the first administrator still has to be created
      description: No sign-in needed.
      operationId: getSetup
      security: []
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                properties:
                  needsSetup:
                    type: boolean
                required:
                - needsSetup
    post:
      tags:
      - App
      summary: Create the first administrator
      description: The administrator was created. No sign-in needed.
      operationId: postSetup
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
              required:
              - name
              - email
              - password
      responses:
        '201':
          description: The administrator was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
  /avatar:
    get:
      tags:
      - App
      summary: Get a member's avatar image
      description: No sign-in needed.
      operationId: getAvatar
      parameters:
      - name: id
        in: query
        required: true
        schema:
          type: string
        description: The member's id.
      - name: v
        in: query
        required: false
        schema:
          type: string
        description: A cache-busting version; when present the image is cached for a year.
      security: []
      responses:
        '200':
          description: The file.
          content:
            image/*:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags:
      - App
      summary: Upload your avatar
      description: Signed-in members.
      operationId: postAvatar
      security: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: PNG, JPEG, WebP or GIF, up to 2 MB.
              required:
              - file
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvatarUpload'
        '400':
          $ref: '#/components/responses/BadRequest'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
    delete:
      tags:
      - App
      summary: Remove your avatar
      description: Signed-in members.
      operationId: deleteAvatar
      security: []
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'
  /workspaces/{workspace}/access:
    get:
      tags:
      - Access
      summary: Get your access in the workspace
      description: Signed-in members.
      operationId: getWorkspacesWorkspaceAccess
      parameters:
      - $ref: '#/components/parameters/workspace'
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Access'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /workspaces/{workspace}/sidebar:
    get:
      tags:
      - Tables
      summary: List the tables you can read, for the sidebar
      description: Signed-in members.
      operationId: getWorkspacesWorkspaceSidebar
      parameters:
      - $ref: '#/components/parameters/workspace'
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SidebarTable'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /workspaces/{workspace}/tables:
    get:
      tags:
      - Tables
      summary: List tables
      description: Administrators only.
      operationId: getWorkspacesWorkspaceTables
      parameters:
      - $ref: '#/components/parameters/workspace'
      - name: page
        in: query
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: pageSize
        in: query
        schema:
          type: integer
          enum:
          - 10
          - 25
          - 50
          - 100
          default: 10
      - name: sort
        in: query
        schema:
          type: string
      - name: order
        in: query
        schema:
          enum:
          - asc
          - desc
      - name: q
        in: query
        schema:
          type: string
        description: Search text.
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                properties:
                  rows:
                    type: array
                    items:
                      $ref: '#/components/schemas/TableSummary'
                  total:
                    type: integer
                required:
                - rows
                - total
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
      - Tables
      summary: Create a table
      description: Administrators only.
      operationId: postWorkspacesWorkspaceTables
      parameters:
      - $ref: '#/components/parameters/workspace'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TableInput'
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Table'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags:
      - Tables
      summary: Delete tables
      description: Moves the tables to the trash, or drops them for good when permanent is true. Administrators
        only.
      operationId: deleteWorkspacesWorkspaceTables
      parameters:
      - $ref: '#/components/parameters/workspace'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TablesDelete'
      responses:
        '200':
          description: Moves the tables to the trash, or drops them for good when permanent is true.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /workspaces/{workspace}/tables/trash:
    get:
      tags:
      - Trash
      summary: List deleted tables
      description: Administrators only.
      operationId: getWorkspacesWorkspaceTablesTrash
      parameters:
      - $ref: '#/components/parameters/workspace'
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                properties:
                  rows:
                    type: array
                    items:
                      $ref: '#/components/schemas/TrashedTable'
                required:
                - rows
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /workspaces/{workspace}/tables/{table}/trash:
    delete:
      tags:
      - Trash
      summary: Delete a table forever
      description: Administrators only.
      operationId: deleteWorkspacesWorkspaceTablesTableTrash
      parameters:
      - $ref: '#/components/parameters/workspace'
      - $ref: '#/components/parameters/table'
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /workspaces/{workspace}/tables/{table}/trash/restore:
    post:
      tags:
      - Trash
      summary: Restore a table
      description: Administrators only.
      operationId: postWorkspacesWorkspaceTablesTableTrashRestore
      parameters:
      - $ref: '#/components/parameters/workspace'
      - $ref: '#/components/parameters/table'
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Created'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /workspaces/{workspace}/tables/{table}:
    get:
      tags:
      - Tables
      summary: Get a table with its columns
      description: Members who can view, create or edit records in the table.
      operationId: getWorkspacesWorkspaceTablesTable
      parameters:
      - $ref: '#/components/parameters/workspace'
      - $ref: '#/components/parameters/table'
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TableDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
      - Tables
      summary: Update a table
      description: Administrators only.
      operationId: patchWorkspacesWorkspaceTablesTable
      parameters:
      - $ref: '#/components/parameters/workspace'
      - $ref: '#/components/parameters/table'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TableUpdate'
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Table'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /workspaces/{workspace}/tables/{table}/favorite:
    put:
      tags:
      - Tables
      summary: Add the table to your favorites
      description: Members who can view the table's records.
      operationId: putWorkspacesWorkspaceTablesTableFavorite
      parameters:
      - $ref: '#/components/parameters/workspace'
      - $ref: '#/components/parameters/table'
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
      - Tables
      summary: Remove the table from your favorites
      description: Signed-in members.
      operationId: deleteWorkspacesWorkspaceTablesTableFavorite
      parameters:
      - $ref: '#/components/parameters/workspace'
      - $ref: '#/components/parameters/table'
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /workspaces/{workspace}/tables/{table}/columns:
    post:
      tags:
      - Columns
      summary: Add a column
      description: Administrators only.
      operationId: postWorkspacesWorkspaceTablesTableColumns
      parameters:
      - $ref: '#/components/parameters/workspace'
      - $ref: '#/components/parameters/table'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ColumnInput'
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Column'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /workspaces/{workspace}/tables/{table}/columns/order:
    put:
      tags:
      - Columns
      summary: Reorder columns
      description: Send every live column id in the new order. A list that no longer matches the table
        is rejected. Administrators only.
      operationId: putWorkspacesWorkspaceTablesTableColumnsOrder
      parameters:
      - $ref: '#/components/parameters/workspace'
      - $ref: '#/components/parameters/table'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ColumnOrder'
      responses:
        '200':
          description: Send every live column id in the new order. A list that no longer matches the table
            is rejected.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /workspaces/{workspace}/tables/{table}/columns/{column}:
    patch:
      tags:
      - Columns
      summary: Update a column
      description: Administrators only.
      operationId: patchWorkspacesWorkspaceTablesTableColumnsColumn
      parameters:
      - $ref: '#/components/parameters/workspace'
      - $ref: '#/components/parameters/table'
      - $ref: '#/components/parameters/column'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ColumnUpdate'
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Column'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags:
      - Columns
      summary: Move a column to the trash
      description: Refused while a view, form or computed column uses it. Administrators only.
      operationId: deleteWorkspacesWorkspaceTablesTableColumnsColumn
      parameters:
      - $ref: '#/components/parameters/workspace'
      - $ref: '#/components/parameters/table'
      - $ref: '#/components/parameters/column'
      responses:
        '200':
          description: Refused while a view, form or computed column uses it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /workspaces/{workspace}/tables/{table}/columns/trash:
    get:
      tags:
      - Trash
      summary: List deleted columns
      description: Administrators only.
      operationId: getWorkspacesWorkspaceTablesTableColumnsTrash
      parameters:
      - $ref: '#/components/parameters/workspace'
      - $ref: '#/components/parameters/table'
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                type: object
                properties:
                  rows:
                    type: array
                    items:
                      $ref: '#/components/schemas/TrashedColumn'
                required:
                - rows
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /workspaces/{workspace}/tables/{table}/columns/{column}/trash:
    delete:
      tags:
      - Trash
      summary: Delete a column forever
      description: Administrators only.
      operationId: deleteWorkspacesWorkspaceTablesTableColumnsColumnTrash
      parameters:
      - $ref: '#/components/parameters/workspace'
      - $ref: '#/components/parameters/table'
      - $ref: '#/components/parameters/column'
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ok'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /workspaces/{workspace}/tables/{table}/columns/{column}/trash/restore:
    post:
      tags:
      - Trash
      summary: Restore a column
      description: Administrators only.
      operationId: postWorkspacesWorkspaceTablesTableColumnsColumnTrashRestore
      parameters:
      - $ref: '#/components/parameters/workspace'
      - $ref: '#/components/parameters/table'
      - $ref: '#/components/parameters/column'
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Created'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /workspaces/{workspace}/tables/{table}/records:
    get:
      tags:
      - Records
      summary: List records
      description: 'Keyset pagination: pass nextCursor or prevCursor back as cursor, with dir set to next
        or prev. Needs the read permission on the table, or on the view or form it goes through.'
      operationId: getWorkspacesWorkspaceTablesTableRecords
      parameters:
      - $ref: '#/components/parameters/workspace'
      - $ref: '#/components/parameters/table'
      - name: cursor
        in: query
        required: false
        schema:
          type: string
          maxLength: 1024
      - name: dir
        in: query
        required: false
        schema:
          type: string
          enum:
          - next
          - prev
      - name: pageSize
        in: query
        required: false
        schema:
          type: number
      - name: sort
        in: query
        required: false
        schema:
          type: string
          maxLength: 64
      - name: order
        in: query
        required: false
        schema:
          type: string
          enum:
          - asc
          - desc
      - name: q
        in: query
        required: false
        schema:
          type: string
          maxLength: 100
      - name: filter
        in: query
        required: false
        schema:
          type: string
          maxLength: 2000
      responses:
        '200':
          description: 'Keyset pagination: pass nextCursor or prevCursor back as cursor, with dir set
            to next or prev.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecordsPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags:
      - Records
      summary: Create a record
      description: Needs the create permission on the table, or on the view or form it goes through.
      operationId: postWorkspacesWorkspaceTablesTableRecords
      parameters:
      - $ref: '#/components/parameters/workspace'
      - $ref: '#/components/parameters/table'
      - name: view
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
        description: Use the permissions you have through this view, and only its columns.
      - name: cursor
        in: query
        required: false
        schema:
          type: string
          maxLength: 1024
      - name: dir
        in: query
        required: false
        schema:
          type: string
          enum:
          - next
          - prev
      - name: pageSize
        in: query
        required: false
        schema:
          type: number
      - name: sort
        in: query
        required: false
        schema:
          type: string
          maxLength: 64
      - name: order
        in: query
        required: false
        schema:
          type: string
          enum:
          - asc
          - desc
      - name: q
        in: query
        required: false
        schema:
          type: string
          maxLength: 100
      - name: filter
        in: query
        required: false
        schema:
          type: string
          maxLength: 2000
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordValues'
      responses:
        '200':
          description: Success.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Created'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
      - Records
      summary: Delete records
      description: Moves the records to the trash. Needs the delete permission on the table, or on the
        view or form it goes through.
      operationId: deleteWorkspacesWorkspaceTablesTableRecords
      parameters:
      - $ref: '#/components/parameters/workspace'
      - $ref: '#/components/parameters/table'
      - name: view
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
        description: Use the permissions you have through this view, and only its columns.
      - name: cursor
        in: query
        required: false
        schema:
          type: string
          maxLength: 1024
      - name: dir
        in: query
        required: false
        schema:
          type: string
          enum:
          - next
          - prev
      - name: pageSize
        in: query
        required: false
        schema:
          type: number
      - name: sort
        in: query
        required: false
        schema:
          type: string
          maxLength: 64
      - name: order
        in: query
        required: false
        schema:
          type: string
          enum:
          - asc
          - desc
      - name: q
        in: query
        required: false
        schema:
          type: string
          maxLength: 100
      - name: filter
        in: query
        required: false
        schema:
          type: string
          maxLength: 2000
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IdsDelete'
      responses:
        '200':
          description: Moves the records to the trash.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trashed'
        '400':
          $ref: '#/components/responses/BadRequest'
