name: Deploy to Cloudflare
on:
  push:
    branches: [main]

concurrency:
  group: void-cloudflare-deploy-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check deploy credentials
        id: check
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID not set; skipping deploy."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.check.outputs.enabled == 'true'
        uses: actions/checkout@v6

      - name: Set up pnpm
        if: steps.check.outputs.enabled == 'true'
        uses: pnpm/action-setup@v5
        with:
          version: 12.21.0

      - name: Set up Node
        if: steps.check.outputs.enabled == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install dependencies
        if: steps.check.outputs.enabled == 'true'
        run: pnpm install --frozen-lockfile

      - name: Public build values
        if: steps.check.outputs.enabled == 'true'
        env:
          VITE_WORKSPACE_NAME: ${{ vars.VITE_WORKSPACE_NAME }}
          VITE_ENABLE_SIGNUP: ${{ vars.VITE_ENABLE_SIGNUP }}
          VITE_DEMO_MODE: ${{ vars.VITE_DEMO_MODE }}
        run: |
          for name in VITE_WORKSPACE_NAME VITE_ENABLE_SIGNUP VITE_DEMO_MODE; do
            value="${!name}"
            if [ -n "$value" ]; then
              echo "$name<<__VITE_EOF__" >> "$GITHUB_ENV"
              echo "$value" >> "$GITHUB_ENV"
              echo "__VITE_EOF__" >> "$GITHUB_ENV"
            fi
          done

      - name: Deploy
        if: steps.check.outputs.enabled == 'true'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CLOUDFLARE_WORKERS_SUBDOMAIN: ${{ vars.CLOUDFLARE_WORKERS_SUBDOMAIN }}
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: pnpm exec void deploy --platform cloudflare
