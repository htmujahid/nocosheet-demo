name: Deploy to Cloudflare
on:
  push:
    branches: [main]

concurrency:
  group: void-cloudflare-deploy-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Secrets can't be read in a job-level `if`, so expose them via env first.
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check deploy credentials
        id: check
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID not set; skipping deploy."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.check.outputs.enabled == 'true'
        uses: actions/checkout@v6

      - name: Set up pnpm
        if: steps.check.outputs.enabled == 'true'
        uses: pnpm/action-setup@v5
        with:
          version: 12.21.0

      - name: Set up Node
        if: steps.check.outputs.enabled == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install dependencies
        if: steps.check.outputs.enabled == 'true'
        run: pnpm install --frozen-lockfile

      - name: Deploy
        if: steps.check.outputs.enabled == 'true'
        env:
          # Required only for PostgreSQL/MySQL provisioning and migrations.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # Required in fresh checkouts when a Worker Version has no preview URL.
          CLOUDFLARE_WORKERS_SUBDOMAIN: ${{ vars.CLOUDFLARE_WORKERS_SUBDOMAIN }}
          # Required only when Cloudflare Access protects Worker readiness.
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: pnpm exec void deploy --platform cloudflare
